name: CI
on:
  pull_request:
  push:
    branches: [main, ll]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/control-plane
      - run: cargo fmt --manifest-path crates/control-plane/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/control-plane/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/control-plane/Cargo.toml --locked
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --manifest-path crates/control-plane/Cargo.toml --locked --all-targets --lcov --output-path control-plane-coverage.lcov --fail-under-lines 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-plane-coverage
          path: control-plane-coverage.lcov
  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: cargo test --manifest-path crates/control-plane/Cargo.toml --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo check --manifest-path frontend/src-tauri/Cargo.toml --locked
