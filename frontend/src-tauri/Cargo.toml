[package]
name = "step-one"
version = "0.1.0"
description = "A security-first desktop workspace for AI agents"
authors = ["Step-One"]
edition = "2021"

[lib]
name = "step_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
step-one-control = { path = "../../crates/control-plane" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.15"
