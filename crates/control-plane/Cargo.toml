[package]
name = "step-one-control"
version = "0.1.0"
edition = "2021"
description = "Testable host control plane for Step-One"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"

