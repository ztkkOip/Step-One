[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step-one"
version = "0.1.0"
description = "A security-first desktop sandbox for agent applications"
requires-python = ">=3.11"

[project.scripts]
step-one = "step_one.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

